base_model: THGLab/Llama-3.1-8B-SmileyLlama-1.1
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer
load_in_4bit: false
load_in_8bit: false
strict: false
output_dir: /path/to/outputs
val_set_size: 0
sequence_len: 1024
sample_packing: false
pad_to_sequence_len: true
gradient_accumulation_steps: 8
micro_batch_size: 2
num_epochs: 1
optimizer: paged_adamw_8bit
lr_scheduler: cosine
learning_rate: 2e-5
train_on_inputs: false
group_by_length: false
bf16: auto
fp16:
tf32: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

overrides_of_model_config:
  rope_scaling:
      factor: 1.0
      low_freq_factor: 1.0
      high_freq_factor: 4.0
      original_max_position_embeddings: 8192
      rope_type: llama3

adapter: lora
lora_model_dir:
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true
lora_fan_in_fan_out:

early_stopping_patience:
resume_from_checkpoint:
logging_steps: 1
xformers_attention:
flash_attention: true
warmup_steps: 4
evals_per_epoch: 1
eval_table_size:
saves_per_epoch: 1
debug:
deepspeed:
weight_decay: 0.0
fsdp:
fsdp_config:
special_tokens:
  pad_token: <|finetune_right_pad_id|>
data_seed: 1
eval_max_new_tokens: 128
seed: 1
rl: dpo
datasets:
  - path: /path/to/dpodataset/dpodataset #Ensure that the folder dpodataset has the file named dpodataset.jsonl inside it
    type: chatml.argilla
    split: train